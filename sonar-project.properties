# SonarCloud project configuration.
#
# organization/projectKey must match the values registered at
# https://sonarcloud.io for this repository. Create the project once under
# your SonarCloud organization, then set these two keys accordingly.
sonar.organization=krnpatel88
sonar.projectKey=krnpatel88_production-grade-cicd
sonar.projectName=production-grade-cicd

# Source and test locations
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12

# Coverage report produced by `pytest --cov-report=xml:coverage.xml`
# (see pyproject.toml [tool.pytest.ini_options]).
sonar.python.coverage.reportPaths=coverage.xml

# Exclude generated / non-source files from analysis
sonar.exclusions=**/__pycache__/**,**/*.pyc,htmlcov/**

# SonarCloud always analyzes against its own hosted quality gate;
# sonar.host.url is intentionally omitted so the scanner defaults to
# https://sonarcloud.io (only needed for self-hosted SonarQube).
