name: Branch Pipeline

# Fast feedback for developers. Runs on every push to a feature branch AND
# to `develop`. Every push gets the same build/test/quality/security
# feedback; only `develop` (the integration branch) goes on to actually
# deploy, to `dev`. This is deliberately the ONLY place in the whole
# pipeline suite that builds and pushes the image — every other pipeline
# (nonprod-pipeline.yml, prod-pipeline.yml) promotes this exact,
# already-built, already-scanned image by its Git SHA tag; they never
# rebuild it.
on:
  push:
    branches: [feature/**, develop]

permissions:
  contents: read
  id-token: write # required for GitHub OIDC -> AWS AssumeRole (dev deploy only)

concurrency:
  group: branch-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: fastapi-ecs-sample

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: Unit tests + coverage report
  # ---------------------------------------------------------------------
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history improves SonarCloud new-code analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Execute unit tests with coverage
        run: pytest
        # pytest is configured (pyproject.toml) to:
        #   - fail if coverage < 80%
        #   - emit coverage.xml (consumed by SonarCloud below)
        #   - emit htmlcov/ (uploaded as an artifact for humans)

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  # ---------------------------------------------------------------------
  # Stage 2: SonarCloud static analysis — code quality + security feedback.
  # Informational (see note below); still runs on every branch push so
  # developers get feedback as early as possible, before a PR even exists.
  # ---------------------------------------------------------------------
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Re-run tests to regenerate coverage.xml for this job
        run: pytest
        # Coverage must be generated in the same job that runs the Sonar
        # scan so the file path in sonar-project.properties resolves.

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SONAR_HOST_URL is intentionally NOT set here: omitting it makes
          # the action default to https://sonarcloud.io.
        # NOTE: Quality Gate enforcement was removed — see project history.
        # This publishes analysis + coverage to the SonarCloud dashboard for
        # visibility; it does not fail the build on gate status.

  # ---------------------------------------------------------------------
  # Stage 3: Build the Docker image ONCE, scan it with Trivy, and push it
  # to Amazon ECR tagged with the Git SHA — the single immutable artifact
  # every downstream pipeline (nonprod, prod) will promote by reference.
  # ---------------------------------------------------------------------
  build-scan-push:
    name: Build Image, Scan (Trivy), Push to ECR
    runs-on: ubuntu-24.04
    needs: [test, sonarcloud]
    timeout-minutes: 15
    outputs:
      image-tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Compute image tag from Git SHA
        id: vars
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (local, not yet pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get current date (for Trivy DB cache key)
        id: trivy-date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.trivy-cache
          key: trivy-db-${{ steps.trivy-date.outputs.date }}
          restore-keys: trivy-db-

      - name: Trivy Scan (human-readable summary for logs)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0" # informational only — does not fail the job
          ignore-unfixed: true
          cache-dir: ${{ github.workspace }}/.trivy-cache

      - name: Configure AWS credentials via OIDC (shared build/push account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          # This is the ONLY docker push in the entire pipeline suite.
          # Feature branches push here too (so a PR into release/** can
          # reference an already-built image for its exact head commit),
          # but only `develop` goes on to actually deploy anywhere below.

  # ---------------------------------------------------------------------
  # Stage 4: Deploy to `dev` — ONLY for pushes to the `develop` branch.
  # Feature-branch pushes stop at Stage 3 (build/scan/push) so a PR opened
  # against release/** later has an image to reference, but nothing gets
  # deployed anywhere for a feature branch on its own.
  # ---------------------------------------------------------------------
  deploy-dev:
    name: Deploy to dev
    needs: build-scan-push
    if: github.ref_name == 'develop'
    uses: ./.github/workflows/cd.yml
    with:
      environment: dev
      image-tag: ${{ needs.build-scan-push.outputs.image-tag }}
    secrets: inherit
